<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Why contiguous arrays are cache-friendly</title><desc id="desc">The CPU checks cache for an array element. A cache miss causes one cache line with several neighboring elements to be copied from RAM. A later neighboring access is then a cache hit.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.step{font-size:22px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#526079}.cell{fill:#edf2f8;stroke:#31415f;stroke-width:2}.line{fill:#d9edff;stroke:#1680c0;stroke-width:4}.hit{fill:#dff3e5;stroke:#16885b;stroke-width:4}.miss{fill:#fff0d7;stroke:#b66b00;stroke-width:3}.arrow{stroke:#31415f;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31415f"/></marker></defs>
  <rect width="1200" height="760" fill="#f7f9fc"/><text x="60" y="62" class="title">Why sequential array access is cache-friendly</text>
  <text x="60" y="113" class="step">1. CPU requests a[2] and checks the cache first.</text>
  <rect x="795" y="80" width="315" height="65" rx="11" class="miss"/><text x="952" y="120" text-anchor="middle" class="label">Not present → cache miss</text>
  <text x="60" y="205" class="label">Main memory (RAM): contiguous array</text>
  <g><rect x="165" y="230" width="110" height="82" class="line"/><rect x="275" y="230" width="110" height="82" class="line"/><rect x="385" y="230" width="110" height="82" class="line"/><rect x="495" y="230" width="110" height="82" class="line"/><rect x="605" y="230" width="110" height="82" class="cell"/><rect x="715" y="230" width="110" height="82" class="cell"/><rect x="825" y="230" width="110" height="82" class="cell"/><rect x="935" y="230" width="110" height="82" class="cell"/></g>
  <g class="body" text-anchor="middle"><text x="220" y="265">a[0]</text><text x="330" y="265">a[1]</text><text x="440" y="265">a[2]</text><text x="550" y="265">a[3]</text><text x="660" y="265">a[4]</text><text x="770" y="265">a[5]</text><text x="880" y="265">a[6]</text><text x="990" y="265">a[7]</text><text x="220" y="295">12</text><text x="330" y="295">7</text><text x="440" y="295">25</text><text x="550" y="295">4</text><text x="660" y="295">19</text><text x="770" y="295">8</text><text x="880" y="295">3</text><text x="990" y="295">15</text></g>
  <path d="M550 330 V416" class="arrow"/><text x="575" y="365" class="step">2. One cache line is copied</text><text x="575" y="392" class="body">requested element + nearby contiguous elements</text>
  <text x="60" y="466" class="label">CPU cache</text>
  <g><rect x="275" y="490" width="110" height="82" class="line"/><rect x="385" y="490" width="110" height="82" class="line"/><rect x="495" y="490" width="110" height="82" class="line"/><rect x="605" y="490" width="110" height="82" class="line"/></g>
  <g class="body" text-anchor="middle"><text x="330" y="524">a[0]</text><text x="440" y="524">a[1]</text><text x="550" y="524">a[2]</text><text x="660" y="524">a[3]</text><text x="330" y="555">12</text><text x="440" y="555">7</text><text x="550" y="555">25</text><text x="660" y="555">4</text></g>
  <rect x="770" y="488" width="350" height="88" rx="11" class="hit"/><text x="945" y="521" text-anchor="middle" class="step">3. Next request: a[3]</text><text x="945" y="552" text-anchor="middle" class="label">Present → cache hit</text>
  <path d="M770 532 H725" class="arrow"/>
  <rect x="120" y="635" width="960" height="78" rx="12" fill="#e8e5ff" stroke="#6557a5" stroke-width="2"/><text x="600" y="668" text-anchor="middle" class="label">Spatial locality</text><text x="600" y="697" text-anchor="middle" class="body">Sequential access is fast because neighboring array elements are likely already in the cache.</text>
</svg>
