<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Contiguous array memory layout</title><desc id="desc">An integer array is represented by adjacent equal-sized cells at consecutive addresses, opposed to scattered storage.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.sub{font-size:21px;fill:#526079}.label{font-size:21px;font-weight:700}.value{font-size:29px;font-weight:700}.addr{font-size:18px;fill:#526079}.formula{font-size:24px;font-weight:700}.cell{fill:#d9edff;stroke:#31415f;stroke-width:2}</style></defs>
  <rect width="1200" height="620" fill="#f7f9fc"/><text x="60" y="65" class="title">Array memory layout: contiguous, not scattered</text>
  <text x="60" y="103" class="sub">Contiguous means the elements occupy consecutive memory locations.</text>
  <text x="160" y="190" class="label">index</text><text x="335" y="190" text-anchor="middle" class="label">0</text><text x="485" y="190" text-anchor="middle" class="label">1</text><text x="635" y="190" text-anchor="middle" class="label">2</text><text x="785" y="190" text-anchor="middle" class="label">3</text><text x="935" y="190" text-anchor="middle" class="label">4</text>
  <text x="160" y="271" class="label">value</text><g><rect x="260" y="215" width="150" height="95" class="cell"/><rect x="410" y="215" width="150" height="95" class="cell"/><rect x="560" y="215" width="150" height="95" class="cell"/><rect x="710" y="215" width="150" height="95" class="cell"/><rect x="860" y="215" width="150" height="95" class="cell"/></g>
  <text x="335" y="274" text-anchor="middle" class="value">12</text><text x="485" y="274" text-anchor="middle" class="value">7</text><text x="635" y="274" text-anchor="middle" class="value">25</text><text x="785" y="274" text-anchor="middle" class="value">4</text><text x="935" y="274" text-anchor="middle" class="value">19</text>
  <text x="160" y="362" class="label">address</text><text x="335" y="362" text-anchor="middle" class="addr">1000</text><text x="485" y="362" text-anchor="middle" class="addr">1004</text><text x="635" y="362" text-anchor="middle" class="addr">1008</text><text x="785" y="362" text-anchor="middle" class="addr">1012</text><text x="935" y="362" text-anchor="middle" class="addr">1016</text>
  <path d="M335 402 H935" stroke="#16885b" stroke-width="5"/><path d="M335 392 V412 M485 392 V412 M635 392 V412 M785 392 V412 M935 392 V412" stroke="#16885b" stroke-width="4"/>
  <text x="635" y="455" text-anchor="middle" class="label">equal-size elements at adjacent addresses</text>
  <rect x="215" y="495" width="770" height="78" rx="12" fill="#e8e5ff" stroke="#6557a5" stroke-width="2"/><text x="600" y="544" text-anchor="middle" class="formula">address of a[i] = base address + i × element size</text>
</svg>
